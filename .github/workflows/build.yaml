name: Build

on:
  push:
    tags-ignore:
      - nightly
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: write

jobs:
  build_plugin:
    name: Build Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Nodejs
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Replacing version field with release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${{github.ref_name}}
          echo "${VERSION}" > version.txt
          VERSION=${VERSION#v}
          sed -i "s/{{DECKY_CLASH_VERSION}}/${VERSION}/g" package.json

      - name: Replacing version field with commit hex
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          HASH=$(git rev-parse HEAD)
          DATE=$(date -u +'%y%m%d')
          VERSION=nightly-${DATE}-${HASH:0:7}
          echo "${VERSION}" > version.txt
          sed -i "s/{{DECKY_CLASH_VERSION}}/${VERSION}/g" package.json

      - name: Install package and build
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Collect files
        run: |
          mkdir -p release/DeckyClash
          cp -R defaults/* dist py_modules release/DeckyClash/
          rm -rf release/DeckyClash/defaults/external/.git
          cp main.py plugin.json package.json LICENSE release/DeckyClash/
          cp version.txt release/
          cd release 
          zip -r DeckyClash.zip DeckyClash
          cd ..

      - name: Pack offline installers
        run: |
          for ARCH in amd64 arm64; do
            OFFLINE_DIR="release/offline-${ARCH}"
            mkdir -p "${OFFLINE_DIR}"
            cp -R release/DeckyClash "${OFFLINE_DIR}/DeckyClash"
            OVERRIDE_MIHOMO_ARCH="${ARCH}" \
              OVERRIDE_PLUGIN_DIR="${OFFLINE_DIR}/DeckyClash" \
              OVERRIDE_DATA_DIR="${OFFLINE_DIR}/DeckyClash/data" \
              ./install.sh --yes --no-privilege --without-plugin --without-restart
            (
              cd "${OFFLINE_DIR}"
              zip -r "../DeckyClash-full-linux-${ARCH}.zip" DeckyClash
            )
            cp install-offline.sh "release/Installer-DeckyClash-linux-${ARCH}.sh"
            cat "release/DeckyClash-full-linux-${ARCH}.zip" >> "release/Installer-DeckyClash-linux-${ARCH}.sh"
          done

          # Keep the historical filenames as amd64 aliases for existing links.
          cp release/DeckyClash-full-linux-amd64.zip release/DeckyClash-full.zip
          cp release/Installer-DeckyClash-linux-amd64.sh release/Installer-DeckyClash.sh

      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deckyclash-artifacts
          path: |
            ./release/DeckyClash.zip
            ./release/DeckyClash-full.zip
            ./release/DeckyClash-full-linux-amd64.zip
            ./release/DeckyClash-full-linux-arm64.zip
            ./release/Installer-DeckyClash.sh
            ./release/Installer-DeckyClash-linux-amd64.sh
            ./release/Installer-DeckyClash-linux-arm64.sh
            ./release/version.txt
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build_plugin
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Publish to Github release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/deckyclash-artifacts/*
          name: Release ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, 'pre') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  nightly:
    name: Publish nightly
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    needs: build_plugin
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Move nightly tag to current commit
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push origin +nightly

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Publish to Github release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/deckyclash-artifacts/*
          name: Release Nightly
          prerelease: true
          tag_name: nightly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
